[project]
name = "docsentry"
version = "0.1.0"
description = "AI-powered documentation reliability and drift detection for software engineering teams."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "DocSentry Team"}
]
dependencies = [
    "pydantic>=2,<3",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "markdown-it-py>=3,<4",
    "linkify-it-py>=2,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]
backend = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.0,<3",
    "pyjwt>=2.8,<3",
    "cryptography>=42.0,<44",
    "bcrypt>=4.0,<5",
    "email-validator>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
]

[project.scripts]
docsentry = "docsentry.cli:app"
docguard = "docsentry.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["B008", "E501", "E712"]

[tool.ruff.lint.per-file-ignores]
"src/docsentry/evaluation/dataset.py" = ["E501"]
"src/docsentry/evaluation/dataset_semantic.py" = ["E501"]
"src/docsentry/evaluation/historical_dataset.py" = ["E501"]
"src/docsentry/evaluation/historical_runner.py" = ["E501"]
"backend/alembic/*" = ["E501", "E402", "I001"]
"backend/app/schemas/__init__.py" = ["F401"]
"backend/app/db/models/__init__.py" = ["F401"]
